services:
  - type: web
    name: wardrobe-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    # uv, not pip — the lock file is the single source of dependency truth.
    # `--frozen` installs backend/uv.lock exactly (no re-resolution), which is
    # what stops prod from silently drifting ahead of local and CI. `--no-dev`
    # is what keeps weave / mcp / pytest off Render; it replaces the old
    # "absent from requirements.txt" guardrail.
    buildCommand: uv sync --frozen --no-dev && uv cache prune --ci
    # `--no-sync` is REQUIRED: a bare `uv run` re-syncs the environment on
    # every boot, which re-installs the dev group we just excluded (verified:
    # it pulls 51 packages) and makes startup depend on PyPI being reachable.
    startCommand: uv run --no-sync uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      # Render still owns the Python version (uv does not set it). Pin uv
      # itself so a future default can't reject the lock's format revision.
      - key: UV_VERSION
        value: "0.11.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Phase 3+
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: WEATHER_LAT
        sync: false
      - key: WEATHER_LON
        sync: false
      # Phase 4
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_RECIPIENT
        sync: false
      # Feedback links (#39) — must equal the GitHub Actions FEEDBACK_SECRET.
      - key: FEEDBACK_SECRET
        sync: false

