name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        # No `python-version:` input on purpose. That input sets UV_PYTHON,
        # which OVERRIDES backend/.python-version — it would make this a
        # second, independent pin. Without it, `uv sync` reads the file, so
        # CI, the crons, Render and local all follow the one pin (#13, #167).
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `--locked` = fail if uv.lock is stale w.r.t. pyproject.toml, rather
      # than silently re-resolving. Render and the crons install that same lock
      # with `--frozen`, so without this CI could pass on a resolution prod
      # never gets. Dev group included here (pytest/black/isort) — prod is the
      # only place that passes --no-dev.
      - name: Install backend deps (incl. dev group)
        working-directory: backend
        run: uv sync --locked

      - name: Check backend formatting
        working-directory: backend
        run: uv run black --check . ../jobs

      - name: Check backend import sorting
        working-directory: backend
        run: uv run isort --check . ../jobs

      # Offline suite only — no secrets, no network, free. The RUN_E2E=1
      # live-pipeline test self-skips when the flag is absent.
      - name: Run offline test suite
        working-directory: backend
        run: uv run pytest
