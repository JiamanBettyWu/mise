name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # Pin to Render's Python, NOT the local 3.14 — PEP 649 lazy
          # annotations on 3.14 silently hide NameErrors that bite on Render
          # at import time (the PR #12 class-order bug, tracked in #13).
          # Running CI on 3.11 makes this workflow the guard for those.
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `--locked` = fail if uv.lock is stale w.r.t. pyproject.toml, rather
      # than silently re-resolving. Render and the crons install that same lock
      # with `--frozen`, so without this CI could pass on a resolution prod
      # never gets. Dev group included here (pytest/black/isort) — prod is the
      # only place that passes --no-dev.
      - name: Install backend deps (incl. dev group)
        working-directory: backend
        run: uv sync --locked

      - name: Check backend formatting
        working-directory: backend
        run: uv run black --check . ../jobs

      - name: Check backend import sorting
        working-directory: backend
        run: uv run isort --check . ../jobs

      # Offline suite only — no secrets, no network, free. The RUN_E2E=1
      # live-pipeline test self-skips when the flag is absent.
      - name: Run offline test suite
        working-directory: backend
        run: uv run pytest
