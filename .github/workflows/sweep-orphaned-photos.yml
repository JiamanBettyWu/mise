name: Sweep orphaned photos

on:
  # Nightly, off-peak from the daily-outfit (08:20 UTC) and preference-inference
  # (Monday 01:20 UTC) crons so they don't compete for Actions minutes. The
  # :40 minute dodges :00, the platform's most congested slot.
  schedule:
    - cron: "40 5 * * *"
  # Allow manual trigger from the Actions tab for testing.
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # Pin to Render's Python, NOT the local 3.14 — same reason as
          # tests.yml (PEP 649 lazy annotations hide NameErrors, #13).
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `--frozen` = install backend/uv.lock exactly, so this runner gets the
      # same versions as Render and CI. `--no-dev` keeps weave/mcp/pytest off
      # the job, replacing the old "absent from requirements.txt" guardrail.
      - name: Install backend deps (prod group only)
        working-directory: backend
        run: uv sync --frozen --no-dev

      - name: Run orphaned-photo sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run --no-sync --project backend python jobs/sweep_orphaned_photos.py
