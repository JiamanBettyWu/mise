name: Weekly preference inference

on:
  # Sunday night ET: 01:20 UTC Monday is ~9:20pm EDT / 8:20pm EST Sunday. The
  # week's verdicts are settled into inferred preferences before Monday's daily
  # email (08:20 UTC), with ~7h of slack to absorb GitHub's best-effort cron
  # delays (routinely 1-3h, same caveat as daily-outfit.yml). The :20 minute
  # dodges :00, the platform's most congested slot. One cron line = one run.
  schedule:
    - cron: "20 1 * * 1"
  # Allow manual trigger from the Actions tab for testing.
  workflow_dispatch:

jobs:
  infer-preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # Pin to Render's Python, NOT the local 3.14 — same reason as
          # tests.yml (PEP 649 lazy annotations hide NameErrors, #13).
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `--frozen` = install backend/uv.lock exactly, so this runner gets the
      # same versions as Render and CI. `--no-dev` keeps weave/mcp/pytest off
      # the job, replacing the old "absent from requirements.txt" guardrail.
      - name: Install backend deps (prod group only)
        working-directory: backend
        run: uv sync --frozen --no-dev

      - name: Run preference inference job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --no-sync --project backend python jobs/infer_preferences.py
